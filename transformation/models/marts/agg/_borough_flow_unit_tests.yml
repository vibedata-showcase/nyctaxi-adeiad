version: 2

unit_tests:
  # --- agg_borough_flow_monthly: the share's branches ------------------------
  - name: borough_flow_share_uses_only_resolved_destinations
    description: >
      A borough's share is its cross-borough trips over the trips whose
      destination is resolved. A trip ending in an unresolved borough is
      published as its own row but leaves the denominator, so the share is
      1/3 rather than 1/4, and the excluded count is published beside it.
    model: agg_borough_flow_monthly
    given:
      - input: ref('fct_trip')
        rows:
          - {pickup_zone_key: Z1, dropoff_zone_key: Z2, pickup_date: '2024-01-05', pickup_datetime: '2024-01-05 10:00:00', is_billable: true, total_amount: 10.0}
          - {pickup_zone_key: Z1, dropoff_zone_key: Z1, pickup_date: '2024-01-06', pickup_datetime: '2024-01-06 10:00:00', is_billable: true, total_amount: 20.0}
          - {pickup_zone_key: Z1, dropoff_zone_key: Z1, pickup_date: '2024-01-07', pickup_datetime: '2024-01-07 10:00:00', is_billable: true, total_amount: 30.0}
          - {pickup_zone_key: Z1, dropoff_zone_key: Z9, pickup_date: '2024-01-08', pickup_datetime: '2024-01-08 10:00:00', is_billable: true, total_amount: 40.0}
      - input: ref('dim_zone')
        rows:
          - {zone_key: Z1, borough_name: Manhattan, is_unresolved_zone: false}
          - {zone_key: Z2, borough_name: Brooklyn, is_unresolved_zone: false}
          - {zone_key: Z9, borough_name: Unknown, is_unresolved_zone: true}
      - input: ref('dim_date')
        rows:
          - {calendar_date: '2024-01-05', month_start_date: '2024-01-01'}
          - {calendar_date: '2024-01-06', month_start_date: '2024-01-01'}
          - {calendar_date: '2024-01-07', month_start_date: '2024-01-01'}
          - {calendar_date: '2024-01-08', month_start_date: '2024-01-01'}
    expect:
      rows:
        - {month_start_date: '2024-01-01', origin_borough: Manhattan, dest_borough: Brooklyn, is_cross_borough: true, is_origin_borough_resolved: true, is_dest_borough_resolved: true, trip_count: 1, trips_with_revenue: 1, total_revenue: 10.0, origin_trip_count: 4, origin_resolved_trip_count: 3, origin_unresolved_trip_count: 1, cross_borough_trip_count: 1, cross_borough_share: 0.3333333333333333}
        - {month_start_date: '2024-01-01', origin_borough: Manhattan, dest_borough: Manhattan, is_cross_borough: false, is_origin_borough_resolved: true, is_dest_borough_resolved: true, trip_count: 2, trips_with_revenue: 2, total_revenue: 50.0, origin_trip_count: 4, origin_resolved_trip_count: 3, origin_unresolved_trip_count: 1, cross_borough_trip_count: 1, cross_borough_share: 0.3333333333333333}
        - {month_start_date: '2024-01-01', origin_borough: Manhattan, dest_borough: Unknown, is_cross_borough: true, is_origin_borough_resolved: true, is_dest_borough_resolved: false, trip_count: 1, trips_with_revenue: 1, total_revenue: 40.0, origin_trip_count: 4, origin_resolved_trip_count: 3, origin_unresolved_trip_count: 1, cross_borough_trip_count: 1, cross_borough_share: 0.3333333333333333}

  - name: borough_flow_unresolved_origin_carries_no_share
    description: >
      An unresolved origin is not a borough, so its share is null even though
      every destination differs from 'Unknown'. Its trips and revenue are still
      published, so nothing disappears.
    model: agg_borough_flow_monthly
    given:
      - input: ref('fct_trip')
        rows:
          - {pickup_zone_key: Z9, dropoff_zone_key: Z1, pickup_date: '2024-01-05', pickup_datetime: '2024-01-05 10:00:00', is_billable: true, total_amount: 12.0}
          - {pickup_zone_key: Z9, dropoff_zone_key: Z9, pickup_date: '2024-01-06', pickup_datetime: '2024-01-06 10:00:00', is_billable: true, total_amount: 8.0}
      - input: ref('dim_zone')
        rows:
          - {zone_key: Z1, borough_name: Manhattan, is_unresolved_zone: false}
          - {zone_key: Z9, borough_name: Unknown, is_unresolved_zone: true}
      - input: ref('dim_date')
        rows:
          - {calendar_date: '2024-01-05', month_start_date: '2024-01-01'}
          - {calendar_date: '2024-01-06', month_start_date: '2024-01-01'}
    expect:
      rows:
        - {month_start_date: '2024-01-01', origin_borough: Unknown, dest_borough: Manhattan, is_cross_borough: true, is_origin_borough_resolved: false, is_dest_borough_resolved: true, trip_count: 1, total_revenue: 12.0, origin_trip_count: 2, origin_resolved_trip_count: 1, origin_unresolved_trip_count: 1, cross_borough_trip_count: 1, cross_borough_share: null}
        - {month_start_date: '2024-01-01', origin_borough: Unknown, dest_borough: Unknown, is_cross_borough: false, is_origin_borough_resolved: false, is_dest_borough_resolved: false, trip_count: 1, total_revenue: 8.0, origin_trip_count: 2, origin_resolved_trip_count: 1, origin_unresolved_trip_count: 1, cross_borough_trip_count: 1, cross_borough_share: null}

  - name: borough_flow_keeps_a_trip_with_no_zone_as_unresolved
    description: >
      A trip whose zone lookup found no row keeps its row with a null borough
      rather than vanishing (ADR 0015), and it counts as unresolved on both
      sides, so it never enters a share's denominator.
    model: agg_borough_flow_monthly
    given:
      - input: ref('fct_trip')
        rows:
          - {pickup_zone_key: null, dropoff_zone_key: Z1, pickup_date: '2024-01-05', pickup_datetime: '2024-01-05 10:00:00', is_billable: true, total_amount: 15.0}
          - {pickup_zone_key: Z1, dropoff_zone_key: Z2, pickup_date: '2024-01-06', pickup_datetime: '2024-01-06 10:00:00', is_billable: true, total_amount: 25.0}
      - input: ref('dim_zone')
        rows:
          - {zone_key: Z1, borough_name: Manhattan, is_unresolved_zone: false}
          - {zone_key: Z2, borough_name: Brooklyn, is_unresolved_zone: false}
      - input: ref('dim_date')
        rows:
          - {calendar_date: '2024-01-05', month_start_date: '2024-01-01'}
          - {calendar_date: '2024-01-06', month_start_date: '2024-01-01'}
    expect:
      rows:
        - {month_start_date: '2024-01-01', origin_borough: null, dest_borough: Manhattan, is_cross_borough: true, is_origin_borough_resolved: false, is_dest_borough_resolved: true, trip_count: 1, total_revenue: 15.0, origin_trip_count: 1, origin_resolved_trip_count: 1, origin_unresolved_trip_count: 0, cross_borough_trip_count: 1, cross_borough_share: null}
        - {month_start_date: '2024-01-01', origin_borough: Manhattan, dest_borough: Brooklyn, is_cross_borough: true, is_origin_borough_resolved: true, is_dest_borough_resolved: true, trip_count: 1, total_revenue: 25.0, origin_trip_count: 1, origin_resolved_trip_count: 1, origin_unresolved_trip_count: 0, cross_borough_trip_count: 1, cross_borough_share: 1.0}

  - name: borough_flow_excludes_non_billable_and_out_of_window_trips
    description: >
      The billable rule (ADR 0003) and the reporting window both apply: a
      refund and a trip outside the window are not in the matrix, so neither
      the pair nor the borough's trip count sees them.
    model: agg_borough_flow_monthly
    given:
      - input: ref('fct_trip')
        rows:
          - {pickup_zone_key: Z1, dropoff_zone_key: Z2, pickup_date: '2024-01-05', pickup_datetime: '2024-01-05 10:00:00', is_billable: true, total_amount: 10.0}
          - {pickup_zone_key: Z1, dropoff_zone_key: Z2, pickup_date: '2024-01-06', pickup_datetime: '2024-01-06 10:00:00', is_billable: false, total_amount: -10.0}
          - {pickup_zone_key: Z1, dropoff_zone_key: Z3, pickup_date: '2024-04-01', pickup_datetime: '2024-04-01 10:00:00', is_billable: true, total_amount: 99.0}
      - input: ref('dim_zone')
        rows:
          - {zone_key: Z1, borough_name: Manhattan, is_unresolved_zone: false}
          - {zone_key: Z2, borough_name: Brooklyn, is_unresolved_zone: false}
          - {zone_key: Z3, borough_name: Queens, is_unresolved_zone: false}
      - input: ref('dim_date')
        rows:
          - {calendar_date: '2024-01-05', month_start_date: '2024-01-01'}
          - {calendar_date: '2024-01-06', month_start_date: '2024-01-01'}
          - {calendar_date: '2024-04-01', month_start_date: '2024-04-01'}
    expect:
      rows:
        - {month_start_date: '2024-01-01', origin_borough: Manhattan, dest_borough: Brooklyn, is_cross_borough: true, trip_count: 1, trips_with_revenue: 1, total_revenue: 10.0, origin_trip_count: 1, origin_resolved_trip_count: 1, origin_unresolved_trip_count: 0, cross_borough_trip_count: 1, cross_borough_share: 1.0}

  - name: borough_flow_share_is_null_when_no_destination_resolves
    description: >
      A borough whose every trip ends in an unresolved borough has a zero
      denominator, so its share is null rather than a division by zero or a
      fabricated 100%.
    model: agg_borough_flow_monthly
    given:
      - input: ref('fct_trip')
        rows:
          - {pickup_zone_key: Z1, dropoff_zone_key: Z9, pickup_date: '2024-01-05', pickup_datetime: '2024-01-05 10:00:00', is_billable: true, total_amount: 5.0}
      - input: ref('dim_zone')
        rows:
          - {zone_key: Z1, borough_name: Manhattan, is_unresolved_zone: false}
          - {zone_key: Z9, borough_name: N/A, is_unresolved_zone: true}
      - input: ref('dim_date')
        rows:
          - {calendar_date: '2024-01-05', month_start_date: '2024-01-01'}
    expect:
      rows:
        - {month_start_date: '2024-01-01', origin_borough: Manhattan, dest_borough: N/A, is_cross_borough: true, trip_count: 1, total_revenue: 5.0, origin_trip_count: 1, origin_resolved_trip_count: 0, origin_unresolved_trip_count: 1, cross_borough_trip_count: 0, cross_borough_share: null}
