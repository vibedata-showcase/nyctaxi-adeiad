version: 2

unit_tests:
  # --- agg_borough_flow_monthly: the crossing share, a resolved destination vs
  # --- an unplaceable one, an unplaceable origin, and a non-billable trip -----
  - name: borough_flow_crossing_share_and_unresolved_endpoints
    description: >
      One month, two metered boroughs (Manhattan, Bronx) and one borough the TLC
      cannot place (Unknown), plus the group for a zone no dimension row matches.
      A Manhattan trip into the Bronx crosses; a Manhattan trip into Unknown and
      one into an unmatched zone both leave the share's numerator and
      denominator; a trip with no pickup zone starts in the unresolved group and
      carries a null share; a Bronx origin with no trip keeps zero rows and a
      null share; and a non-billable trip is not counted at all.
    model: agg_borough_flow_monthly
    overrides:
      vars:
        report_start: '2024-01-01'
        report_end: '2024-04-01'
    given:
      - input: ref('dim_date')
        rows:
          - {calendar_date: '2024-01-05'}
          - {calendar_date: '2024-01-20'}
      - input: ref('dim_zone')
        rows:
          - {zone_key: z-manhattan, borough_name: Manhattan, is_unresolved_zone: false}
          - {zone_key: z-bronx, borough_name: Bronx, is_unresolved_zone: false}
          - {zone_key: z-unknown, borough_name: Unknown, is_unresolved_zone: true}
      - input: ref('fct_trip')
        rows:
          - {pickup_datetime: '2024-01-05 08:00:00', pickup_date: '2024-01-05', pickup_zone_key: z-manhattan, dropoff_zone_key: z-manhattan, total_amount: 10.0, is_billable: true}
          - {pickup_datetime: '2024-01-05 09:00:00', pickup_date: '2024-01-05', pickup_zone_key: z-manhattan, dropoff_zone_key: z-bronx, total_amount: 20.0, is_billable: true}
          - {pickup_datetime: '2024-01-06 09:00:00', pickup_date: '2024-01-06', pickup_zone_key: z-manhattan, dropoff_zone_key: z-nowhere, total_amount: 5.0, is_billable: true}
          - {pickup_datetime: '2024-01-06 10:00:00', pickup_date: '2024-01-06', pickup_zone_key: z-manhattan, dropoff_zone_key: z-unknown, total_amount: 6.0, is_billable: true}
          - {pickup_datetime: '2024-01-07 09:00:00', pickup_date: '2024-01-07', pickup_zone_key: null, dropoff_zone_key: z-bronx, total_amount: 7.0, is_billable: true}
          - {pickup_datetime: '2024-01-08 09:00:00', pickup_date: '2024-01-08', pickup_zone_key: z-manhattan, dropoff_zone_key: z-bronx, total_amount: 3.0, is_billable: false}
          - {pickup_datetime: '2024-01-20 09:00:00', pickup_date: '2024-01-20', pickup_zone_key: z-manhattan, dropoff_zone_key: z-manhattan, total_amount: 4.0, is_billable: true}
    expect:
      rows:
        - {trip_month: '2024-01-01', origin_borough: Manhattan, dest_borough: Manhattan, origin_is_unresolved: false, dest_is_unresolved: false, is_cross_borough: false, trip_count: 2, total_revenue: 14.0, origin_trip_count: 5, resolved_destination_trip_count: 3, unresolved_destination_trip_count: 2, crossing_trip_count: 1, crossing_share: 0.3333333333333333}
        - {trip_month: '2024-01-01', origin_borough: Manhattan, dest_borough: Bronx, origin_is_unresolved: false, dest_is_unresolved: false, is_cross_borough: true, trip_count: 1, total_revenue: 20.0, origin_trip_count: 5, resolved_destination_trip_count: 3, unresolved_destination_trip_count: 2, crossing_trip_count: 1, crossing_share: 0.3333333333333333}
        - {trip_month: '2024-01-01', origin_borough: Manhattan, dest_borough: Unknown, origin_is_unresolved: false, dest_is_unresolved: true, is_cross_borough: null, trip_count: 1, total_revenue: 6.0, origin_trip_count: 5, resolved_destination_trip_count: 3, unresolved_destination_trip_count: 2, crossing_trip_count: 1, crossing_share: 0.3333333333333333}
        - {trip_month: '2024-01-01', origin_borough: Manhattan, dest_borough: unresolved, origin_is_unresolved: false, dest_is_unresolved: true, is_cross_borough: null, trip_count: 1, total_revenue: 5.0, origin_trip_count: 5, resolved_destination_trip_count: 3, unresolved_destination_trip_count: 2, crossing_trip_count: 1, crossing_share: 0.3333333333333333}
        - {trip_month: '2024-01-01', origin_borough: Bronx, dest_borough: Manhattan, origin_is_unresolved: false, dest_is_unresolved: false, is_cross_borough: true, trip_count: 0, total_revenue: 0.0, origin_trip_count: 0, resolved_destination_trip_count: 0, unresolved_destination_trip_count: 0, crossing_trip_count: 0, crossing_share: null}
        - {trip_month: '2024-01-01', origin_borough: Bronx, dest_borough: Bronx, origin_is_unresolved: false, dest_is_unresolved: false, is_cross_borough: false, trip_count: 0, total_revenue: 0.0, origin_trip_count: 0, resolved_destination_trip_count: 0, unresolved_destination_trip_count: 0, crossing_trip_count: 0, crossing_share: null}
        - {trip_month: '2024-01-01', origin_borough: Bronx, dest_borough: Unknown, origin_is_unresolved: false, dest_is_unresolved: true, is_cross_borough: null, trip_count: 0, total_revenue: 0.0, origin_trip_count: 0, resolved_destination_trip_count: 0, unresolved_destination_trip_count: 0, crossing_trip_count: 0, crossing_share: null}
        - {trip_month: '2024-01-01', origin_borough: Bronx, dest_borough: unresolved, origin_is_unresolved: false, dest_is_unresolved: true, is_cross_borough: null, trip_count: 0, total_revenue: 0.0, origin_trip_count: 0, resolved_destination_trip_count: 0, unresolved_destination_trip_count: 0, crossing_trip_count: 0, crossing_share: null}
        - {trip_month: '2024-01-01', origin_borough: Unknown, dest_borough: Manhattan, origin_is_unresolved: true, dest_is_unresolved: false, is_cross_borough: null, trip_count: 0, total_revenue: 0.0, origin_trip_count: 0, resolved_destination_trip_count: 0, unresolved_destination_trip_count: 0, crossing_trip_count: null, crossing_share: null}
        - {trip_month: '2024-01-01', origin_borough: Unknown, dest_borough: Bronx, origin_is_unresolved: true, dest_is_unresolved: false, is_cross_borough: null, trip_count: 0, total_revenue: 0.0, origin_trip_count: 0, resolved_destination_trip_count: 0, unresolved_destination_trip_count: 0, crossing_trip_count: null, crossing_share: null}
        - {trip_month: '2024-01-01', origin_borough: Unknown, dest_borough: Unknown, origin_is_unresolved: true, dest_is_unresolved: true, is_cross_borough: null, trip_count: 0, total_revenue: 0.0, origin_trip_count: 0, resolved_destination_trip_count: 0, unresolved_destination_trip_count: 0, crossing_trip_count: null, crossing_share: null}
        - {trip_month: '2024-01-01', origin_borough: Unknown, dest_borough: unresolved, origin_is_unresolved: true, dest_is_unresolved: true, is_cross_borough: null, trip_count: 0, total_revenue: 0.0, origin_trip_count: 0, resolved_destination_trip_count: 0, unresolved_destination_trip_count: 0, crossing_trip_count: null, crossing_share: null}
        - {trip_month: '2024-01-01', origin_borough: unresolved, dest_borough: Manhattan, origin_is_unresolved: true, dest_is_unresolved: false, is_cross_borough: null, trip_count: 0, total_revenue: 0.0, origin_trip_count: 1, resolved_destination_trip_count: 1, unresolved_destination_trip_count: 0, crossing_trip_count: null, crossing_share: null}
        - {trip_month: '2024-01-01', origin_borough: unresolved, dest_borough: Bronx, origin_is_unresolved: true, dest_is_unresolved: false, is_cross_borough: null, trip_count: 1, total_revenue: 7.0, origin_trip_count: 1, resolved_destination_trip_count: 1, unresolved_destination_trip_count: 0, crossing_trip_count: null, crossing_share: null}
        - {trip_month: '2024-01-01', origin_borough: unresolved, dest_borough: Unknown, origin_is_unresolved: true, dest_is_unresolved: true, is_cross_borough: null, trip_count: 0, total_revenue: 0.0, origin_trip_count: 1, resolved_destination_trip_count: 1, unresolved_destination_trip_count: 0, crossing_trip_count: null, crossing_share: null}
        - {trip_month: '2024-01-01', origin_borough: unresolved, dest_borough: unresolved, origin_is_unresolved: true, dest_is_unresolved: true, is_cross_borough: null, trip_count: 0, total_revenue: 0.0, origin_trip_count: 1, resolved_destination_trip_count: 1, unresolved_destination_trip_count: 0, crossing_trip_count: null, crossing_share: null}
