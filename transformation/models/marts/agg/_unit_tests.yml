version: 2

unit_tests:
  # --- agg_borough_flow_monthly: the share and the cross-borough count -------
  - name: borough_flow_share_is_a_ratio_of_sums
    description: >
      Two origin boroughs in one month. Manhattan sends one trip to Queens and
      one to EWR, and keeps one inside Manhattan, so its share is 2/3 on all
      three of its rows, including the intra-borough one. Queens keeps one trip
      inside Queens, so its share is 0. A per-pair mean would give Manhattan 1/3
      and 1/2 on its two cross-borough rows and 0 on the diagonal, and the
      billable = false trip to Queens must not count, so this fails if the share
      is averaged or the billable filter is lost. cross_borough_trip_count is a
      per-row count, so it is 0 on the diagonal rows and 1 on a crossing row.
    model: agg_borough_flow_monthly
    overrides:
      vars:
        report_start: '2024-01-01'
        report_end: '2024-04-01'
    given:
      - input: ref('fct_trip')
        rows:
          - {pickup_zone_key: z1, dropoff_zone_key: z2, pickup_date: '2024-02-05', pickup_datetime: '2024-02-05 09:00:00', total_amount: 10.00, is_billable: true}
          - {pickup_zone_key: z1, dropoff_zone_key: z3, pickup_date: '2024-02-06', pickup_datetime: '2024-02-06 09:00:00', total_amount: 20.00, is_billable: true}
          - {pickup_zone_key: z1, dropoff_zone_key: z1, pickup_date: '2024-02-07', pickup_datetime: '2024-02-07 09:00:00', total_amount: 30.00, is_billable: true}
          - {pickup_zone_key: z2, dropoff_zone_key: z2, pickup_date: '2024-02-08', pickup_datetime: '2024-02-08 09:00:00', total_amount: 40.00, is_billable: true}
          - {pickup_zone_key: z1, dropoff_zone_key: z2, pickup_date: '2024-02-09', pickup_datetime: '2024-02-09 09:00:00', total_amount: 99.00, is_billable: false}
      - input: ref('dim_zone')
        rows:
          - {zone_key: z1, borough_name: Manhattan}
          - {zone_key: z2, borough_name: Queens}
          - {zone_key: z3, borough_name: EWR}
    expect:
      rows:
        - {trip_month: '2024-02-01', origin_borough: Manhattan, dest_borough: Manhattan, trip_count: 1, total_revenue: 30.00, cross_borough_trip_count: 0, cross_borough_trip_share: 0.6666666666666666}
        - {trip_month: '2024-02-01', origin_borough: Manhattan, dest_borough: Queens, trip_count: 1, total_revenue: 10.00, cross_borough_trip_count: 1, cross_borough_trip_share: 0.6666666666666666}
        - {trip_month: '2024-02-01', origin_borough: Manhattan, dest_borough: EWR, trip_count: 1, total_revenue: 20.00, cross_borough_trip_count: 1, cross_borough_trip_share: 0.6666666666666666}
        - {trip_month: '2024-02-01', origin_borough: Queens, dest_borough: Queens, trip_count: 1, total_revenue: 40.00, cross_borough_trip_count: 0, cross_borough_trip_share: 0.0}
