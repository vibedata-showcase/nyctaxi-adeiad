version: 2

unit_tests:
  # --- agg_borough_flow_monthly: crossings, unresolved destinations, population
  - name: borough_flow_counts_crossings_and_repeats_origin_month_totals
    description: >
      One Manhattan trip to each of Manhattan, Brooklyn and Queens over four
      trips in January: the same-borough row is not a crossing, the other two
      are, and every row repeats the origin-month's total of four and its two
      crossings, so the share is 0.5 on each.
    model: agg_borough_flow_monthly
    overrides:
      vars:
        report_start: '2024-01-01'
        report_end: '2024-04-01'
    given:
      - input: ref('fct_trip')
        rows:
          - {pickup_datetime: '2024-01-05 10:00:00', pickup_date: '2024-01-05', pickup_zone_key: Z1, dropoff_zone_key: Z1, total_amount: 10.0, is_billable: true}
          - {pickup_datetime: '2024-01-06 10:00:00', pickup_date: '2024-01-06', pickup_zone_key: Z1, dropoff_zone_key: Z1, total_amount: 10.0, is_billable: true}
          - {pickup_datetime: '2024-01-07 10:00:00', pickup_date: '2024-01-07', pickup_zone_key: Z1, dropoff_zone_key: Z2, total_amount: 20.0, is_billable: true}
          - {pickup_datetime: '2024-01-08 10:00:00', pickup_date: '2024-01-08', pickup_zone_key: Z1, dropoff_zone_key: Z3, total_amount: 5.0, is_billable: true}
      - input: ref('dim_zone')
        rows:
          - {zone_key: Z1, borough_name: Manhattan}
          - {zone_key: Z2, borough_name: Brooklyn}
          - {zone_key: Z3, borough_name: Queens}
    expect:
      rows:
        - {trip_month: '2024-01-01', origin_borough: Manhattan, dest_borough: Manhattan, is_cross_borough: false, trip_count: 2, total_revenue: 20.0, cross_borough_trip_count: 2, origin_trip_count: 4, cross_borough_share: 0.5}
        - {trip_month: '2024-01-01', origin_borough: Manhattan, dest_borough: Brooklyn, is_cross_borough: true, trip_count: 1, total_revenue: 20.0, cross_borough_trip_count: 2, origin_trip_count: 4, cross_borough_share: 0.5}
        - {trip_month: '2024-01-01', origin_borough: Manhattan, dest_borough: Queens, is_cross_borough: true, trip_count: 1, total_revenue: 5.0, cross_borough_trip_count: 2, origin_trip_count: 4, cross_borough_share: 0.5}

  - name: borough_flow_counts_an_unresolved_or_unmatched_destination_as_a_crossing
    description: >
      A trip to a borough the TLC marks Unknown and a trip whose dropoff zone
      joins no dimension row are both destinations like any other: they keep
      their rows and count as crossings (ADR 0019), rather than being dropped
      or read as staying put.
    model: agg_borough_flow_monthly
    overrides:
      vars:
        report_start: '2024-01-01'
        report_end: '2024-04-01'
    given:
      - input: ref('fct_trip')
        rows:
          - {pickup_datetime: '2024-01-05 10:00:00', pickup_date: '2024-01-05', pickup_zone_key: Z1, dropoff_zone_key: Z9, total_amount: 12.0, is_billable: true}
          - {pickup_datetime: '2024-01-06 10:00:00', pickup_date: '2024-01-06', pickup_zone_key: Z1, dropoff_zone_key: Z99, total_amount: 8.0, is_billable: true}
          - {pickup_datetime: '2024-01-07 10:00:00', pickup_date: '2024-01-07', pickup_zone_key: Z1, dropoff_zone_key: Z1, total_amount: 10.0, is_billable: true}
          - {pickup_datetime: '2024-01-08 10:00:00', pickup_date: '2024-01-08', pickup_zone_key: Z1, dropoff_zone_key: Z1, total_amount: 6.0, is_billable: true}
      - input: ref('dim_zone')
        rows:
          - {zone_key: Z1, borough_name: Manhattan}
          - {zone_key: Z9, borough_name: Unknown}
    expect:
      rows:
        - {trip_month: '2024-01-01', origin_borough: Manhattan, dest_borough: Manhattan, is_cross_borough: false, trip_count: 2, total_revenue: 16.0, cross_borough_trip_count: 2, origin_trip_count: 4, cross_borough_share: 0.5}
        - {trip_month: '2024-01-01', origin_borough: Manhattan, dest_borough: Unknown, is_cross_borough: true, trip_count: 1, total_revenue: 12.0, cross_borough_trip_count: 2, origin_trip_count: 4, cross_borough_share: 0.5}
        - {trip_month: '2024-01-01', origin_borough: Manhattan, dest_borough: null, is_cross_borough: true, trip_count: 1, total_revenue: 8.0, cross_borough_trip_count: 2, origin_trip_count: 4, cross_borough_share: 0.5}

  - name: borough_flow_keeps_only_billable_trips_inside_the_window_by_month
    description: >
      A non-billable trip and a trip after the window are excluded, so the pair
      keeps only its one billable in-window trip; a February trip lands in its
      own month. A pair with no qualifying trip is absent rather than zero
      (ADR 0018), and each month's share is computed within that month.
    model: agg_borough_flow_monthly
    overrides:
      vars:
        report_start: '2024-01-01'
        report_end: '2024-04-01'
    given:
      - input: ref('fct_trip')
        rows:
          - {pickup_datetime: '2024-01-05 10:00:00', pickup_date: '2024-01-05', pickup_zone_key: Z1, dropoff_zone_key: Z2, total_amount: 20.0, is_billable: true}
          - {pickup_datetime: '2024-01-06 10:00:00', pickup_date: '2024-01-06', pickup_zone_key: Z1, dropoff_zone_key: Z2, total_amount: -5.0, is_billable: false}
          - {pickup_datetime: '2024-04-01 00:30:00', pickup_date: '2024-04-01', pickup_zone_key: Z1, dropoff_zone_key: Z2, total_amount: 20.0, is_billable: true}
          - {pickup_datetime: '2024-02-10 10:00:00', pickup_date: '2024-02-10', pickup_zone_key: Z2, dropoff_zone_key: Z1, total_amount: 15.0, is_billable: true}
      - input: ref('dim_zone')
        rows:
          - {zone_key: Z1, borough_name: Manhattan}
          - {zone_key: Z2, borough_name: Brooklyn}
    expect:
      rows:
        - {trip_month: '2024-01-01', origin_borough: Manhattan, dest_borough: Brooklyn, is_cross_borough: true, trip_count: 1, total_revenue: 20.0, cross_borough_trip_count: 1, origin_trip_count: 1, cross_borough_share: 1.0}
        - {trip_month: '2024-02-01', origin_borough: Brooklyn, dest_borough: Manhattan, is_cross_borough: true, trip_count: 1, total_revenue: 15.0, cross_borough_trip_count: 1, origin_trip_count: 1, cross_borough_share: 1.0}
