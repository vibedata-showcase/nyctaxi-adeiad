  - name: borough_flow_publishes_a_row_for_a_borough_with_no_qualifying_pair
    description: A borough whose only pair carries 5 trips publishes no pair, but still carries its own row with a null destination and its crossing share of 100 percent.
    model: agg_borough_flow_monthly
    overrides:
      vars:
        report_start: '2024-01-01'
        report_end: '2024-04-01'
    given:
      - input: ref('fct_trip')
        rows:
          - {pickup_datetime: '2024-03-01 09:00:00', pickup_zone_key: Z-Q, dropoff_zone_key: Z-R, total_amount: 7.5, is_billable: true}
          - {pickup_datetime: '2024-03-02 09:01:00', pickup_zone_key: Z-Q, dropoff_zone_key: Z-R, total_amount: 7.5, is_billable: true}
          - {pickup_datetime: '2024-03-03 09:02:00', pickup_zone_key: Z-Q, dropoff_zone_key: Z-R, total_amount: 7.5, is_billable: true}
          - {pickup_datetime: '2024-03-04 09:03:00', pickup_zone_key: Z-Q, dropoff_zone_key: Z-R, total_amount: 7.5, is_billable: true}
          - {pickup_datetime: '2024-03-05 09:04:00', pickup_zone_key: Z-Q, dropoff_zone_key: Z-R, total_amount: 7.5, is_billable: true}
      - input: ref('dim_zone')
        rows:
          - {zone_key: Z-Q, borough_name: Staten Island}
          - {zone_key: Z-R, borough_name: Brooklyn}
    expect:
      rows:
        - {trip_month: '2024-03-01', origin_borough: Staten Island, dest_borough: null, trip_count: 0, total_revenue: 0.0, origin_departing_trip_count: 5, origin_crossing_trip_count: 5, origin_crossing_trip_share: 1.0}

