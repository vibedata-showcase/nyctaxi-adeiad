version: "0.2.0.dev0"
name: nyc_taxi_trips
description: One row per TLC trip (yellow + green, 2024-01 to 2024-03) with billable flag, fleet attribution, and conformed dimensions. Trips star of the nyc-taxi-duckdb-demo warehouse.
ai_context:
  instructions: Use for trip-level revenue and demand analysis inside the report window (ADR 0003). Billable math must filter on is_billable; green trips never carry airport_fee.
  synonyms:
    - yellow and green taxi trips
    - TLC trips
datasets:
  - name: trips
    source: core.fct_trip
    primary_key: [trip_key]
    description: One row per TLC trip. The grain of the warehouse.
    ai_context:
      synonyms:
        - trips
        - rides
    fields:
      - name: trip_key
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: trip_key
        datatype: String
        description: Natural key from the trip_natural_key macro.
      - name: pickup_date
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: pickup_date
        datatype: Date
        dimension:
          is_time: true
        description: Calendar date of pickup; report window grain is day.
      - name: pickup_date_key
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: pickup_date_key
        datatype: Integer
        description: Surrogate key into date for the pickup date.
      - name: pickup_hour
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: pickup_hour
        datatype: Integer
        description: Hour of day of pickup (0-23), joins dim_daypart.
      - name: daypart_code
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: daypart_code
        datatype: String
        description: Analyst-owned daypart band for pickup_hour.
      - name: service_type_key
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: service_type_key
        datatype: String
        description: Fleet service type of the trip.
      - name: pickup_location_id
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: pickup_location_id
        datatype: Integer
        description: TLC location id of the pickup zone before the as-of join; the zone's natural key, and what the trip-to-zone join matches.
      - name: dropoff_location_id
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: dropoff_location_id
        datatype: Integer
        description: TLC location id of the dropoff zone before the as-of join; the zone's natural key.
      - name: pickup_zone_key
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: pickup_zone_key
        datatype: String
        description: Role-playing zone key for the origin, resolved as of the trip date (Pickup_Zone role).
      - name: dropoff_zone_key
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: dropoff_zone_key
        datatype: String
        description: Role-playing zone key for the destination, resolved as of the trip date (Dropoff_Zone role).
      - name: vendor_key
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: vendor_key
        datatype: String
        description: Vendor surrogate, resolved as of the trip date.
      - name: payment_method_key
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: payment_method_key
        datatype: Integer
        description: How the trip settled.
      - name: rate_plan_key
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: rate_plan_key
        datatype: Integer
        description: Rate plan in effect for the trip.
      - name: trip_quality_key
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: trip_quality_key
        datatype: String
        description: Junk-dimension key over the observed quality verdicts.
      - name: is_billable
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: is_billable
        datatype: Boolean
        description: Total amount is positive (ADR 0003). Null handling per ADR.
      - name: is_fleet_attributed
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: is_fleet_attributed
        datatype: Boolean
        description: True when Harbour Point operated the trip; null driver/vehicle/shift otherwise.
      - name: airport_fee_status
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: airport_fee_status
        datatype: String
        description: Yellow only; null for every green trip by construction.
      - name: total_amount
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: total_amount
        datatype: Decimal
        description: Total amount charged, row level. Aggregate only through metrics.
      - name: fare_residual
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: fare_residual
        datatype: Decimal
        description: Trip total minus every modelled fare component, row level.
      - name: shift_id
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: shift_id
        datatype: String
        description: Attributed fleet shift; null for non-fleet trips.
    custom_extensions:
      - vendor_name: VIBEDATA
        data: '{"vibedata_version": "1.5", "logical_sources": [{"name": "LTS1_detail", "physical_table": "fct_trip", "priority_group": 1, "content_grain": ["trip"], "column_map": {"trip_key": "trip_key", "pickup_location_id": "pickup_location_id", "dropoff_location_id": "dropoff_location_id", "pickup_date_key": "pickup_date_key", "pickup_date": "pickup_date", "pickup_hour": "pickup_hour", "daypart_code": "daypart_code", "service_type_key": "service_type_key", "pickup_zone_key": "pickup_zone_key", "dropoff_zone_key": "dropoff_zone_key", "vendor_key": "vendor_key", "payment_method_key": "payment_method_key", "rate_plan_key": "rate_plan_key", "trip_quality_key": "trip_quality_key", "is_billable": "is_billable", "is_fleet_attributed": "is_fleet_attributed", "airport_fee_status": "airport_fee_status", "total_amount": "total_amount", "fare_residual": "fare_residual", "shift_id": "shift_id", "fare_residual_total": "fare_residual", "trip_count": "trip_key", "billable_trip_count": "is_billable", "billable_revenue": "total_amount", "billable_revenue_pickup_borough": "total_amount"}}, {"name": "LTS2_zone_day_agg", "physical_table": "agg_trip_zone_daily", "priority_group": 0, "content_grain": ["pickup_date", "pickup_location_id"], "note": "trip_count checked against agg_trip_zone_daily.sql: count(*) over in-window trips, the same aggregation as the metric. content_filter held by assert_semantic_content_holds. Refused: trip_count_7d_avg, revenue_28d_rolling, prev_day_trip_count and same_day_last_week_trip_count. Their windows count rows, not days, so a zone-day with no trips stretches them, and revenue_28d_rolling sums unfiltered totals; the rolling metrics are time_series ROLLING over the calendar instead.", "column_map": {"pickup_date": "pickup_date", "trip_count": "trip_count"}, "content_levels": [{"via": "trips_to_date", "level": "day", "key_columns": ["pickup_date"]}, {"via": "trips_to_pickup_zone", "level": "zone", "key_columns": ["pickup_location_id"]}], "content_filter": "pickup_date >= DATE ''2024-01-01'' AND pickup_date < DATE ''2024-04-01'' AND pickup_zone_key IS NOT NULL"}, {"name": "LTS3_zone_daypart_dow", "physical_table": "agg_trip_zone_daypart_dow", "priority_group": 0, "content_grain": ["pickup_location_id", "day_of_week", "is_non_working_day", "daypart_code", "is_peak", "service_type_key"], "note": "trip_count checked: count(*) unfiltered; billable_trip_count checked: count(*) filter (where f.is_billable), the same aggregation as the metric. content_filter held by assert_semantic_content_holds. day_of_week and is_non_working_day split the rows below the Time hierarchy''s total but are no level of it, so no Time level is claimed.", "column_map": {"service_type_key": "service_type_key", "daypart_code": "daypart_code", "trip_count": "trip_count", "billable_trip_count": "billable_trip_count"}, "content_levels": [{"via": "trips_to_pickup_zone", "level": "zone", "key_columns": ["pickup_location_id"]}, {"via": "trips_to_daypart", "level": "daypart", "key_columns": ["daypart_code"]}, {"via": "trips_to_service_type", "key_columns": ["service_type_key"]}], "content_filter": "pickup_date >= DATE ''2024-01-01'' AND pickup_date < DATE ''2024-04-01'' AND pickup_zone_key IS NOT NULL AND pickup_date_key IS NOT NULL AND daypart_code IS NOT NULL AND pickup_hour IS NOT NULL"}, {"name": "LTS4_band_profile", "physical_table": "agg_trip_band_profile", "priority_group": 0, "content_grain": ["distance_band", "duration_band", "fare_band", "service_type_key", "pickup_borough", "daypart_code"], "note": "reconciliation held by assert_aggs_cover_every_trip; the joins that define this population live in the mart SQL. Binding held by assert_semantic_content_holds.", "column_map": {"service_type_key": "service_type_key", "daypart_code": "daypart_code", "trip_count": "trip_count"}, "content_levels": [{"via": "trips_to_service_type", "key_columns": ["service_type_key"]}, {"via": "trips_to_daypart", "level": "daypart", "key_columns": ["daypart_code"]}, {"via": "trips_to_pickup_zone", "level": "borough", "key_columns": ["pickup_borough"]}], "content_filter": "pickup_date >= DATE ''2024-01-01'' AND pickup_date < DATE ''2024-04-01''"}, {"name": "LTS5_weather_borough_daily", "physical_table": "agg_weather_demand_daily", "priority_group": 0, "content_grain": ["obs_date", "borough_name"], "note": "reconciliation held by assert_aggs_cover_every_trip; the spine and as-of attribution that define this population live in the mart SQL (ADR 0009). Its borough_name carries the sentinel ''unresolved'' for trips no zone places in a borough (ADR 0012); that group is no Geography member, so assert_semantic_levels_hold reports it and a join at the borough level drops it. Binding held by assert_semantic_content_holds.", "column_map": {"pickup_date": "obs_date", "trip_count": "trip_count"}, "content_levels": [{"via": "trips_to_date", "level": "day", "key_columns": ["obs_date"]}, {"via": "trips_to_pickup_zone", "level": "borough", "key_columns": ["borough_name"]}], "content_filter": "pickup_date >= DATE ''2024-01-01'' AND pickup_date < DATE ''2024-04-01''"}, {"name": "LTS7_daily_zone_revenue", "physical_table": "mart_daily_zone_revenue", "priority_group": 0, "content_grain": ["trip_date", "pickup_location_id"], "note": "Refused: trip_count (the mart applies f.is_billable, so its trip_count is the billable count); pickup_zone_key (the mart carries zone_natural_key as pickup_location_id, not the zone surrogate); fare_residual_total and total_amount (no residual or row-level total column survives the group by); fare, tip, surcharge and toll revenue (no metric declared). content_filter held by assert_semantic_content_holds.", "column_map": {"pickup_date": "trip_date", "billable_trip_count": "trip_count", "billable_revenue": "total_revenue"}, "content_levels": [{"via": "trips_to_date", "level": "day", "key_columns": ["trip_date"]}, {"via": "trips_to_pickup_zone", "level": "zone", "key_columns": ["pickup_location_id"]}], "content_filter": "pickup_date >= DATE ''2024-01-01'' AND pickup_date < DATE ''2024-04-01'' AND is_billable AND pickup_zone_key IS NOT NULL"}, {"name": "LTS8_monthly_service_summary", "physical_table": "mart_monthly_service_summary", "priority_group": 0, "content_grain": ["trip_month", "service_type", "payment_method_name"], "note": "Refused: pickup_date (month grain only); trip_count (the mart applies f.is_billable); payment_method_key (the mart carries payment_method_name, not the key); total_miles, avg_fare and est_processor_fees (no metric declared). content_filter held by assert_semantic_content_holds.", "column_map": {"service_type_key": "service_type", "billable_trip_count": "trip_count", "billable_revenue": "total_revenue"}, "content_levels": [{"via": "trips_to_date", "level": "month", "key_columns": ["trip_month"]}, {"via": "trips_to_service_type", "key_columns": ["service_type"]}, {"via": "trips_to_payment_method", "level": "payment_method", "key": "payment_method_name", "key_columns": ["payment_method_name"]}], "content_filter": "pickup_date >= DATE ''2024-01-01'' AND pickup_date < DATE ''2024-04-01'' AND is_billable AND payment_method_key IS NOT NULL"}, {"name": "LTS9_trip_quality_scorecard", "physical_table": "mart_trip_quality_scorecard", "priority_group": 0, "content_grain": ["trip_month", "vendor_id", "service_type_key"], "note": "Refused: billable_trip_count (the mart only carries non_billable_count; billable is the difference, not a column, so the map would be an expression the model does not have); vendor_key (the mart carries vendor_natural_key as vendor_id); pickup_date (month grain only); clean, non-billable, refund, zero-distance, implausible-speed, sparse-feed, unresolved-zone, undocumented-rate, unbalanced-total counts and the two rates (no metric declared). content_filter held by assert_semantic_content_holds.", "column_map": {"service_type_key": "service_type_key", "trip_count": "trip_count"}, "content_levels": [{"via": "trips_to_date", "level": "month", "key_columns": ["trip_month"]}, {"via": "trips_to_service_type", "key_columns": ["service_type_key"]}, {"via": "trips_to_vendor", "level": "vendor", "key_columns": ["vendor_id"]}], "content_filter": "pickup_date >= DATE ''2024-01-01'' AND pickup_date < DATE ''2024-04-01'' AND trip_quality_key IS NOT NULL"}, {"name": "LTS10_borough_flow_monthly", "physical_table": "agg_borough_flow_monthly", "priority_group": 0, "content_grain": ["month_start_date", "origin_borough", "destination_borough"], "note": "billable_trip_count bound to trip_count and billable_revenue to billable_revenue: both aggregations are the mart''s own, held by assert_semantic_content_holds. Refused: cross_borough_billable_trip_count, origin_billable_trip_count and cross_borough_share. The share''s numerator states ''ended in a different resolved borough'', a condition over both zone roles at borough grain; the trips star has no borough-level field and no metric expression over its role keys can state it, so no honest binding exists and the detail cannot prove the aggregate. The columns stay on the relation for a consumer reading it directly; ADR 0019 and ADR 0020 rule them. Also refused: trip_count (the mart applies is_billable, so its trip_count is the billable count); is_intra_borough, origin_is_unresolved and destination_is_unresolved (flags, no metric declared). origin_borough and destination_borough carry Unknown and N/A for trips no zone places in a borough (ADR 0012); a join at the borough level includes them as the members the dimension carries.", "column_map": {"billable_trip_count": "billable_trip_count", "billable_revenue": "billable_revenue"}, "content_levels": [{"via": "trips_to_date", "level": "month", "key_columns": ["month_start_date"]}, {"via": "trips_to_pickup_zone", "level": "borough", "key_columns": ["origin_borough"]}, {"via": "trips_to_dropoff_zone", "level": "borough", "key_columns": ["destination_borough"]}], "content_filter": "pickup_date >= DATE ''2024-01-01'' AND pickup_date < DATE ''2024-04-01'' AND is_billable AND pickup_zone_key IS NOT NULL AND dropoff_zone_key IS NOT NULL"}]}'
  - name: date
    source: core.dim_date
    primary_key: [date_key]
    description: Date spine with holiday, weekend, and school-term flags from master data.
    fields:
      - name: date_key
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: date_key
        datatype: Integer
        description: yyyymmdd integer key.
      - name: calendar_date
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: calendar_date
        datatype: Date
        dimension:
          is_time: true
        description: Calendar date.
      - name: calendar_year
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: calendar_year
        datatype: Integer
        dimension:
          is_time: true
        description: Calendar year grain.
      - name: calendar_quarter
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: calendar_quarter
        datatype: Integer
        dimension:
          is_time: true
        description: Calendar quarter grain (1-4).
      - name: calendar_month
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: calendar_month
        datatype: Integer
        dimension:
          is_time: true
        description: Calendar month grain (1-12).
      - name: month_name
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: month_name
        datatype: String
        dimension:
          is_time: true
        description: Month label for the month grain.
      - name: month_start_date
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: month_start_date
        datatype: Date
        description: First day of the calendar month; key of the month level, since calendar_month repeats every year.
      - name: week_start_date
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: week_start_date
        datatype: Date
        description: Monday that starts the calendar week (ADR 0014); key of the week level.
      - name: is_weekend
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: is_weekend
        datatype: Boolean
        description: Saturday or Sunday.
      - name: is_holiday
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: is_holiday
        datatype: Boolean
        description: Master-data holiday flag; corrections restate reports without code change.
      - name: is_non_working_day
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: is_non_working_day
        datatype: Boolean
        description: Weekend or holiday; weekday holidays behave like weekends for demand.
    custom_extensions:
      - vendor_name: VIBEDATA
        data: '{"vibedata_version": "1.5", "logical_sources": [{"name": "LTS1_calendar", "physical_table": "dim_date", "priority_group": 1, "content_grain": ["calendar_date"], "column_map": {"date_key": "date_key", "calendar_date": "calendar_date", "calendar_year": "calendar_year", "calendar_quarter": "calendar_quarter", "calendar_month": "calendar_month", "month_name": "month_name", "is_weekend": "is_weekend", "is_holiday": "is_holiday", "is_non_working_day": "is_non_working_day", "month_start_date": "month_start_date", "week_start_date": "week_start_date"}}], "levels": [{"name": "year", "keys": [{"name": "calendar_year", "fields": ["calendar_year"], "primary": true, "display": true}]}, {"name": "quarter", "keys": [{"name": "year_quarter", "fields": ["calendar_year", "calendar_quarter"], "primary": true}]}, {"name": "month", "keys": [{"name": "month_start_date", "fields": ["month_start_date"], "primary": true, "display": true}, {"name": "year_month", "fields": ["calendar_year", "calendar_month"]}], "attributes": ["month_name"]}, {"name": "week", "keys": [{"name": "week_start_date", "fields": ["week_start_date"], "primary": true, "display": true}]}, {"name": "day", "keys": [{"name": "calendar_date", "fields": ["calendar_date"], "primary": true, "display": true}, {"name": "date_key", "fields": ["date_key"]}], "attributes": ["is_weekend", "is_holiday", "is_non_working_day"]}], "row_level": {"level": "day", "versioned": false}, "hierarchies": [{"name": "Time", "is_time": true, "levels": ["year", "quarter", "month", "day"]}, {"name": "Week", "is_time": true, "levels": ["week", "day"]}]}'
  - name: zone
    source: core.dim_zone
    primary_key: [zone_key]
    description: Type 2 zone dimension, natural key location_id, versioned by master data.
    ai_context:
      synonyms:
        - pickup zone
        - dropoff zone
        - taxi zone
    fields:
      - name: zone_key
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: zone_key
        datatype: String
        description: Surrogate over natural key plus valid-from date.
      - name: zone_natural_key
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: zone_natural_key
        datatype: Integer
        description: TLC location_id.
      - name: zone_name
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: zone_name
        datatype: String
        description: Zone display name.
      - name: borough_name
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: borough_name
        datatype: String
        description: Borough, including Unknown and N/A for unresolved zones.
      - name: reporting_region
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: reporting_region
        datatype: String
        description: Reporting region above borough.
      - name: valid_from_date
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: valid_from_date
        datatype: Date
        dimension:
          is_time: false
        description: Half-open validity start for the as-of join. Audit column, not a time dimension.
      - name: valid_to_date
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: valid_to_date
        datatype: Date
        dimension:
          is_time: false
        description: Half-open validity end; 2099-12-31 marks the current version.
      - name: is_current_version
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: is_current_version
        datatype: Boolean
        description: True for the current version of each zone.
    custom_extensions:
      - vendor_name: VIBEDATA
        data: '{"vibedata_version": "1.5", "scd": {"type": 2, "natural_key": "zone_natural_key", "valid_from": "valid_from_date", "valid_to": "valid_to_date", "is_current": "is_current_version", "open_ended_value": "2099-12-31"}, "logical_sources": [{"name": "LTS1_base", "physical_table": "dim_zone", "priority_group": 1, "content_grain": ["zone"], "column_map": {"zone_key": "zone_key", "zone_natural_key": "zone_natural_key", "zone_name": "zone_name", "borough_name": "borough_name", "reporting_region": "reporting_region", "valid_from_date": "valid_from_date", "valid_to_date": "valid_to_date", "is_current_version": "is_current_version"}}, {"name": "LTS2_pickup_role", "physical_table": "Pickup_Zone", "priority_group": 1, "content_grain": ["zone"], "column_map": {"zone_key": "zone_key", "zone_natural_key": "zone_natural_key", "zone_name": "zone_name", "borough_name": "borough_name", "reporting_region": "reporting_region", "valid_from_date": "valid_from_date", "valid_to_date": "valid_to_date", "is_current_version": "is_current_version"}}, {"name": "LTS3_dropoff_role", "physical_table": "Dropoff_Zone", "priority_group": 1, "content_grain": ["zone"], "column_map": {"zone_key": "zone_key", "zone_natural_key": "zone_natural_key", "zone_name": "zone_name", "borough_name": "borough_name", "reporting_region": "reporting_region", "valid_from_date": "valid_from_date", "valid_to_date": "valid_to_date", "is_current_version": "is_current_version"}}], "levels": [{"name": "region", "keys": [{"name": "reporting_region", "fields": ["reporting_region"], "primary": true, "display": true}]}, {"name": "borough", "keys": [{"name": "borough_name", "fields": ["borough_name"], "primary": true, "display": true}]}, {"name": "zone", "keys": [{"name": "zone_natural_key", "fields": ["zone_natural_key"], "primary": true, "display": true}], "attributes": ["zone_name"]}], "row_level": {"level": "zone", "versioned": true}, "hierarchies": [{"name": "Geography", "scd_rollup": "as_of", "levels": ["region", "borough", "zone"]}]}'
  - name: vendor
    source: core.dim_vendor
    primary_key: [vendor_key]
    description: Type 2 vendor dimension, natural key vendor_id.
    fields:
      - name: vendor_key
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: vendor_key
        datatype: String
        description: Surrogate over natural key plus valid-from date.
      - name: vendor_natural_key
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: vendor_natural_key
        datatype: Integer
        description: Source vendor identifier.
      - name: valid_from_date
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: valid_from_date
        datatype: Date
        dimension:
          is_time: false
        description: Half-open validity start for the as-of join.
      - name: valid_to_date
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: valid_to_date
        datatype: Date
        dimension:
          is_time: false
        description: Half-open validity end.
      - name: is_current_version
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: is_current_version
        datatype: Boolean
        description: True for the current version of each vendor.
    custom_extensions:
      - vendor_name: VIBEDATA
