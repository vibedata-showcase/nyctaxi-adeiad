metrics:
  - name: trip_count
    expression:
      dialects:
        - dialect: ANSI_SQL
          expression: SUM(CASE WHEN trips.trip_key IS NOT NULL THEN 1 ELSE 0 END)
    description: Trips, billable or not.
    datatype: Integer
    ai_context:
      synonyms:
        - Trips
    custom_extensions:
      - vendor_name: VIBEDATA
        data: '{"vibedata_version": "1.5", "aggregation": "SUM"}'
  - name: billable_trip_count
    expression:
      dialects:
        - dialect: ANSI_SQL
          expression: SUM(CASE WHEN trips.is_billable THEN 1 ELSE 0 END)
    description: Trips whose total amount is positive.
    datatype: Integer
    ai_context:
      synonyms:
        - Billable trips
    custom_extensions:
      - vendor_name: VIBEDATA
        data: '{"vibedata_version": "1.5", "aggregation": "SUM", "filter": "trips.is_billable"}'
  - name: billable_revenue
    expression:
      dialects:
        - dialect: ANSI_SQL
          expression: SUM(CASE WHEN trips.is_billable THEN trips.total_amount ELSE 0 END)
    description: Total amount charged on billable trips. Excludes cash tips.
    datatype: Decimal
    ai_context:
      synonyms:
        - Billable revenue
    custom_extensions:
      - vendor_name: VIBEDATA
        data: '{"vibedata_version": "1.5", "aggregation": "SUM", "filter": "trips.is_billable"}'
  - name: billable_average_fare
    expression:
      dialects:
        - dialect: ANSI_SQL
          expression: SUM(CASE WHEN trips.is_billable THEN trips.total_amount ELSE 0 END) * 1.0 / NULLIF(SUM(CASE WHEN trips.is_billable THEN 1 ELSE 0 END), 0)
    description: 'Average total per billable trip, weighted by trips: billable revenue over billable trips, rebuilt at whatever grain is asked (two-pass).'
    datatype: Decimal
    ai_context:
      synonyms:
        - Average fare
    custom_extensions:
      - vendor_name: VIBEDATA
        data: '{"vibedata_version": "1.5", "derived_expression": "billable_revenue * 1.0 / NULLIF(billable_trip_count, 0)"}'
  - name: mean_pickup_zone_average_fare
    expression:
      dialects:
        - dialect: ANSI_SQL
          expression: SUM(CASE WHEN trips.is_billable THEN trips.total_amount ELSE 0 END) * 1.0 / NULLIF(SUM(CASE WHEN trips.is_billable THEN 1 ELSE 0 END), 0)
    description: "Unweighted mean of each pickup zone's average fare: the average fare is computed per zone first, then the zones are averaged with equal weight. A thin zone counts as much as a busy one; billable_average_fare is the trip-weighted figure."
    datatype: Decimal
    ai_context:
      synonyms:
        - Average of zone average fares
    custom_extensions:
      - vendor_name: VIBEDATA
        data: '{"vibedata_version": "1.5", "based_on_dimensions": {"of": "billable_average_fare", "across": [{"via": "trips_to_pickup_zone", "level": "zone"}], "rule": "AVG"}}'
  - name: avg_daily_billable_revenue
    expression:
      dialects:
        - dialect: ANSI_SQL
          expression: SUM(CASE WHEN trips.is_billable THEN trips.total_amount ELSE 0 END)
    description: Billable revenue summed per pickup day, then averaged over the days that had billable trips.
    datatype: Decimal
    ai_context:
      synonyms:
        - Average daily billable revenue
    custom_extensions:
      - vendor_name: VIBEDATA
        data: '{"vibedata_version": "1.5", "based_on_dimensions": {"of": "billable_revenue", "across": [{"via": "trips_to_date", "level": "day"}], "rule": "AVG"}}'
  - name: peak_day_billable_trip_count
    expression:
      dialects:
        - dialect: ANSI_SQL
          expression: SUM(CASE WHEN trips.is_billable THEN 1 ELSE 0 END)
    description: 'Billable trips on the busiest pickup day of the period: counted per day, then the largest day kept.'
    datatype: Integer
    ai_context:
      synonyms:
        - Busiest day trips
    custom_extensions:
      - vendor_name: VIBEDATA
        data: '{"vibedata_version": "1.5", "based_on_dimensions": {"of": "billable_trip_count", "across": [{"via": "trips_to_date", "level": "day"}], "rule": "MAX"}}'
  - name: fare_residual_total
    expression:
      dialects:
        - dialect: ANSI_SQL
          expression: SUM(trips.fare_residual)
    description: Trip total minus every modelled fare component, summed.
    datatype: Decimal
    ai_context:
      synonyms:
        - Fare residual
    custom_extensions:
      - vendor_name: VIBEDATA
        data: '{"vibedata_version": "1.5", "aggregation": "SUM"}'
  - name: billable_revenue_pickup_borough
    expression:
      dialects:
        - dialect: ANSI_SQL
          expression: SUM(CASE WHEN trips.is_billable THEN trips.total_amount ELSE 0 END)
    description: Billable revenue of the whole pickup borough, whatever zone the query groups by. The denominator of a zone's share of its borough.
    datatype: Decimal
    ai_context:
      synonyms:
        - Borough billable revenue
    custom_extensions:
      - vendor_name: VIBEDATA
        data: '{"vibedata_version": "1.5", "aggregation": "SUM", "at_levels": [{"via": "trips_to_pickup_zone", "level": "borough"}], "filter": "trips.is_billable"}'
  - name: billable_revenue_prior_month
    expression:
      dialects:
        - dialect: ANSI_SQL
          expression: SUM(CASE WHEN trips.is_billable THEN trips.total_amount ELSE 0 END)
    description: Billable revenue of the month before, aligned to each row's month.
    datatype: Decimal
    ai_context:
      synonyms:
        - Last month's billable revenue
    custom_extensions:
      - vendor_name: VIBEDATA
        data: '{"vibedata_version": "1.5", "aggregation": "SUM", "time_series": {"function": "AGO", "of": "billable_revenue", "via": "trips_to_date", "level": "month", "offset": 1}}'
  - name: billable_revenue_month_to_date
    expression:
      dialects:
        - dialect: ANSI_SQL
          expression: SUM(CASE WHEN trips.is_billable THEN trips.total_amount ELSE 0 END)
    description: Billable revenue from the first of the month to each row's date.
    datatype: Decimal
    ai_context:
      synonyms:
        - Month-to-date billable revenue
    custom_extensions:
      - vendor_name: VIBEDATA
        data: '{"vibedata_version": "1.5", "aggregation": "SUM", "time_series": {"function": "TODATE", "of": "billable_revenue", "via": "trips_to_date", "level": "month"}}'
  - name: billable_revenue_rolling_28_days
    expression:
      dialects:
        - dialect: ANSI_SQL
          expression: SUM(CASE WHEN trips.is_billable THEN trips.total_amount ELSE 0 END)
    description: Billable revenue over the 28 calendar days ending on each row's day.
    datatype: Decimal
    ai_context:
      synonyms:
        - 28-day billable revenue
    custom_extensions:
      - vendor_name: VIBEDATA
        data: '{"vibedata_version": "1.5", "aggregation": "SUM", "time_series": {"function": "ROLLING", "of": "billable_revenue", "via": "trips_to_date", "level": "day", "periods": 28}}'
  - name: billable_trip_count_rolling_7_days
    expression:
      dialects:
        - dialect: ANSI_SQL
          expression: SUM(CASE WHEN trips.is_billable THEN 1 ELSE 0 END)
    description: Billable trips over the 7 calendar days ending on each row's day.
    datatype: Integer
    ai_context:
      synonyms:
        - 7-day billable trips
    custom_extensions:
      - vendor_name: VIBEDATA
        data: '{"vibedata_version": "1.5", "aggregation": "SUM", "time_series": {"function": "ROLLING", "of": "billable_trip_count", "via": "trips_to_date", "level": "day", "periods": 7}}'
