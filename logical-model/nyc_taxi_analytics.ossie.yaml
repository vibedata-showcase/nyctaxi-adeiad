      - vendor_name: VIBEDATA
        data: '{"vibedata_version": "1.5", "logical_sources": [{"name": "LTS1_detail", "physical_table": "bridge_zone_poi", "priority_group": 1, "content_grain": ["poi"], "note": "One row per (zone, POI category). A zone-level measure reaches it through zone_poi_to_zone from the one side and is allocated by allocation_factor, whose shares sum to 1 per zone: held by assert_zone_poi_allocation_sums_to_one. A zone with no POI keeps its trips under a null category at weight 1, so no trip is dropped (ADR 0015).", "column_map": {"poi_id": "poi_id", "zone_natural_key": "zone_natural_key", "poi_category": "poi_category", "poi_category_name": "poi_category_name", "poi_name": "poi_name", "demand_weight": "demand_weight", "allocation_factor": "allocation_factor"}}]}'
