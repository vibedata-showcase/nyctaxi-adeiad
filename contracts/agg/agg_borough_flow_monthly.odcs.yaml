apiVersion: v3.2.0
kind: DataContract
id: 3f9c1a44-7d21-4f68-9b0e-2c5a6d84e117
name: agg_borough_flow_monthly
version: 1.0.0
status: active
servers:
  - server: sample-nyctaxi-comp
    type: duckdb
    database: domain.duckdb
    schema: agg
schema:
  - name: agg_borough_flow_monthly
    properties:
      - name: month_start_date
        logicalType: date
        physicalType: DATE
        required: true
        primaryKey: true
        primaryKeyPosition: 1
        description: "First day of the month the trips were picked up in."
      - name: origin_borough
        logicalType: string
        physicalType: VARCHAR
        required: true
        primaryKey: true
        primaryKeyPosition: 2
        description: "Borough the trip started in, as the zone master data names it; the value 'unresolved' groups every pickup zone the master data places in no borough."
      - name: dest_borough
        logicalType: string
        physicalType: VARCHAR
        required: true
        primaryKey: true
        primaryKeyPosition: 3
        description: "Borough the trip ended in, on the same rule as origin_borough."
      - name: trip_count
        logicalType: integer
        physicalType: BIGINT
        required: true
        description: "Billable trips picked up in the month that ran from origin_borough to dest_borough. Every pair with at least one such trip has a row; no pair is suppressed by a trip floor."
      - name: total_revenue
        logicalType: number
        physicalType: DOUBLE
        description: "Sum of the trips' total amount, which includes the no-charge and dispute payment methods because the billable rule reads only the total."
      - name: is_cross_borough
        logicalType: boolean
        physicalType: BOOLEAN
        description: "True when the trip ended in a borough other than the one it started in. Null when either end is 'unresolved', since a zone in no borough can be neither the same borough nor a different one."
      - name: origin_located_trip_count
        logicalType: integer
        physicalType: BIGINT
        description: "The origin borough's billable trips for the month whose destination lies in a borough: the denominator of cross_borough_trip_share. Repeats on every destination row of that borough and month, so it is not additive across rows; the non-additive figure is trip_count. Null when origin_borough is 'unresolved'."
      - name: origin_cross_borough_trip_count
        logicalType: integer
        physicalType: BIGINT
        description: "Those of the origin borough's located-destination trips that ended in another borough: the numerator of cross_borough_trip_share. Repeats across destination rows like the denominator, so it is not additive either. Null when origin_borough is 'unresolved'."
      - name: cross_borough_trip_share
        logicalType: number
        physicalType: DOUBLE
        description: "origin_cross_borough_trip_count divided by origin_located_trip_count: the share of the origin borough's located-destination traffic that left the borough. Null when the denominator is zero or the origin is 'unresolved'. Repeats across destination rows and is never to be averaged; roll up by summing the two counts instead."
description:
  purpose: >
    Borough-to-borough flow of billable trips, one row per month, origin borough and
    destination borough, for every pair with at least one billable trip. The companion
    to agg_od_flow_matrix at borough grain, and unlike that surface it publishes no trip
    floor (ADR 0018): a pair with a single trip has a row, so summing the rows reproduces
    the star's billable traffic and revenue exactly. A trip whose pickup or dropoff zone
    the master data places in no borough is neither in-borough nor cross-borough; it
    appears under the origin or destination value 'unresolved', counts in trip_count and
    total_revenue, and is excluded from the share. The share is that origin borough's
    cross-borough trips over its trips with a located destination (ADR 0019), computed as
    a ratio of the two sums (ADR 0016) and therefore repeated on every destination row of
    the borough and month: sum the two counts to roll up, never average the share.
