apiVersion: v3.2.0
kind: DataContract
id: 3f1c8b62-5d47-4c19-9a0e-6d2b7e4f8c31
name: agg_borough_flow_monthly
version: 1.0.0
status: active
servers:
  - server: sample-nyctaxi-comp
    type: duckdb
    database: domain.duckdb
    schema: agg
schema:
  - name: agg_borough_flow_monthly
    properties:
      - name: trip_month
        description: "First day of the calendar month the trips started in; the month grain of the row."
        logicalType: date
        physicalType: DATE
        primaryKey: true
        primaryKeyPosition: 1
        quality:
          - type: library
            metric: nullValues
            mustBe: 0
      - name: origin_borough
        description: "Borough of the zone the trips started in, as the zone version in force on the pickup date names it; the unplaceable zones appear as 'Unknown' and 'N/A' (ADR 0012)."
        logicalType: string
        physicalType: VARCHAR
        primaryKey: true
        primaryKeyPosition: 2
        quality:
          - type: library
            metric: nullValues
            mustBe: 0
      - name: dest_borough
        description: "Borough of the zone the trips ended in, on the same version rule; 'Unknown', 'N/A' and the out-of-city 'EWR' appear as their own groups (ADR 0018)."
        logicalType: string
        physicalType: VARCHAR
        primaryKey: true
        primaryKeyPosition: 3
        quality:
          - type: library
            metric: nullValues
            mustBe: 0
      - name: billable_trip_count
        description: "Billable trips picked up in the month that started in the origin borough and ended in the destination borough. Published without a floor, so a cell may hold a single trip (ADR 0019)."
        logicalType: integer
        physicalType: BIGINT
        required: true
        quality:
          - type: library
            metric: nullValues
            mustBe: 0
      - name: total_revenue
        description: "Sum of the total amount charged on those trips, in USD."
        logicalType: number
        physicalType: DOUBLE
        required: true
      - name: cross_borough_trip_count
        description: "Billable trips from the origin borough in the month whose destination borough is a different name, including the unplaceable and out-of-city destinations (ADR 0018). A property of the origin borough and month: it repeats on every row of that origin and month, so summing it across destinations double-counts."
        logicalType: integer
        physicalType: BIGINT
        required: true
      - name: cross_borough_share
        description: "The cross-borough trips divided by all of the origin borough's trips in the month, as a ratio between 0 and 1; null when the denominator is zero. Repeats across the origin borough's rows, so do not sum it."
        logicalType: number
        physicalType: DOUBLE
