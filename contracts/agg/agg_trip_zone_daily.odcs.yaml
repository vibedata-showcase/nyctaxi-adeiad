apiVersion: v3.2.0
kind: DataContract
id: 6767ad11-6380-5435-8382-25fdafb31a75
name: agg_trip_zone_daily
version: 1.1.0
status: active
servers:
  - server: sample-nyctaxi-comp
    type: duckdb
    database: domain.duckdb
    schema: agg
schema:
  - name: agg_trip_zone_daily
    properties:
      - name: pickup_date_key
        logicalType: integer
        physicalType: INTEGER
      - name: pickup_date
        logicalType: date
        physicalType: DATE
      - name: pickup_location_id
        logicalType: integer
        physicalType: BIGINT
      - name: zone_name
        logicalType: string
        physicalType: VARCHAR
      - name: borough_name
        logicalType: string
        physicalType: VARCHAR
        description: Borough of the zone version in force on the pickup date.
      - name: reporting_region
        logicalType: string
        physicalType: VARCHAR
        description: Reporting region of the zone version in force on the pickup date.
      - name: trip_count
        logicalType: integer
        physicalType: BIGINT
        description: Trips, billable or not, picked up in the window.
      - name: total_revenue
        logicalType: number
        physicalType: DOUBLE
        description: Sum of total_amount over those trips, refunds included.
      - name: total_miles
        logicalType: number
        physicalType: DOUBLE
      - name: attributed_driver_count
        logicalType: integer
        physicalType: BIGINT
      - name: billable_trip_count
        logicalType: integer
        physicalType: BIGINT
        description: Trips whose total amount is positive, in the reporting window.
      - name: billable_fare_revenue
        logicalType: number
        physicalType: DOUBLE
        description: Sum of the fare over the billable trips.
      - name: billable_tip_revenue
        logicalType: number
        physicalType: DOUBLE
        description: Sum of the tip over the billable trips.
      - name: billable_surcharge_revenue
        logicalType: number
        physicalType: DOUBLE
        description: Sum of the surcharges over the billable trips.
      - name: billable_toll_revenue
        logicalType: number
        physicalType: DOUBLE
        description: Sum of the tolls over the billable trips.
      - name: billable_total_revenue
        logicalType: number
        physicalType: DOUBLE
        description: Sum of the total amount over the billable trips.
      - name: prev_day_trip_count
        logicalType: integer
        physicalType: BIGINT
      - name: same_day_last_week_trip_count
        logicalType: integer
        physicalType: BIGINT
      - name: trip_count_7d_avg
        logicalType: number
        physicalType: DOUBLE
      - name: revenue_28d_rolling
        logicalType: number
        physicalType: DOUBLE
      - name: revenue_rank_that_day
        logicalType: integer
        physicalType: BIGINT
