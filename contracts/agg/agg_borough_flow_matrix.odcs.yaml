apiVersion: v3.2.0
kind: DataContract
id: 4b7c1e02-9a65-4f3d-8c11-6d2e5a9b7f04
name: agg_borough_flow_matrix
version: 1.0.0
status: active
servers:
  - server: sample-nyctaxi-comp
    type: duckdb
    database: domain.duckdb
    schema: agg
schema:
  - name: agg_borough_flow_matrix
    dataGranularityDescription: One row per month, origin borough and destination borough, over the five New York City boroughs plus one unresolved group on each side (ADR 0018). Every combination is published; a pair with no billable trip carries zero.
    properties:
      - name: month_start_date
        description: "First day of the calendar month the trips were picked up in, cast to DATE. The month key of dim_date, so the table joins the calendar."
        logicalType: date
        physicalType: DATE
        quality:
          - type: library
            metric: nullValues
            mustBe: 0
      - name: origin_borough
        description: "Borough the trip started in, being one of the five New York City boroughs or the single unresolved group. A zone the TLC cannot place in a borough belongs to the unresolved group, not to a borough of its own (ADR 0012, ADR 0018)."
        logicalType: string
        physicalType: VARCHAR
        quality:
          - type: library
            metric: nullValues
            mustBe: 0
      - name: destination_borough
        description: "Borough the trip ended in, over the same members as the origin. The unresolved member means the destination zone cannot be placed in a borough (ADR 0012, ADR 0018)."
        logicalType: string
        physicalType: VARCHAR
        quality:
          - type: library
            metric: nullValues
            mustBe: 0
      - name: flow_class
        description: "What the pair is: cross_borough when both sides are New York City boroughs and they differ, in_borough when the same city borough is on both sides, unresolved when either side is the unresolved group. A trip to an unresolved destination is neither in-borough nor cross-borough (ADR 0018)."
        logicalType: string
        physicalType: VARCHAR
        quality:
          - type: library
            metric: nullValues
            mustBe: 0
          - type: library
            metric: invalidValues
            arguments:
              validValues:
                - cross_borough
                - in_borough
                - unresolved
            mustBe: 0
      - name: trip_count
        description: "Billable trips, as the grain of the row names it, picked up inside the reporting window (ADR 0003). Zero when the pair carried none. No minimum applies at this grain (ADR 0018)."
        logicalType: integer
        physicalType: BIGINT
        quality:
          - type: library
            metric: nullValues
            mustBe: 0
      - name: revenue
        description: "Sum of total_amount over the row's billable trips, in USD; zero when the pair carried none."
        logicalType: number
        physicalType: DOUBLE
        quality:
          - type: library
            metric: nullValues
            mustBe: 0
      - name: origin_cross_borough_trips
        description: "Cross-borough trips that started in origin_borough in month_start_date, whatever the destination row is. The numerator of cross_borough_share, repeated on every row of its origin and month (ADR 0016)."
        logicalType: integer
        physicalType: BIGINT
      - name: origin_trips_to_known_destination
        description: "Trips that started in origin_borough in month_start_date and ended in a known borough, whatever the destination row is. The denominator of cross_borough_share; it excludes trips to the unresolved group, which leave no borough to measure against (ADR 0016, ADR 0018)."
        logicalType: integer
        physicalType: BIGINT
      - name: cross_borough_share
        description: "origin_cross_borough_trips divided by origin_trips_to_known_destination, as a fraction rather than a percentage: the share of a borough's trips to a known destination that left it. A ratio of summed trips, rebuilt rather than averaged across pairs (ADR 0016); null, never zero, when the denominator is zero, which is always the case for the unresolved origin."
        logicalType: number
        physicalType: DOUBLE
