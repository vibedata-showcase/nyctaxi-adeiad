apiVersion: v3.2.0
kind: DataContract
id: edf94c85-cbf3-58ee-9672-f448930698dd
name: mart_daily_zone_revenue
version: 1.0.2
status: active
servers:
  - server: sample-nyctaxi-comp
    type: duckdb
    database: domain.duckdb
    schema: finance
schema:
  - name: mart_daily_zone_revenue
    properties:
      - name: trip_date
        logicalType: date
        physicalType: DATE
        quality:
          - type: library
            metric: nullValues
            mustBe: 0
      - name: total_revenue
        logicalType: number
        physicalType: DOUBLE
        quality:
          - type: library
            metric: nullValues
            mustBe: 0
      - name: pickup_location_id
        logicalType: integer
        physicalType: BIGINT
        relationships:
          - to: dim_zone.zone_natural_key
      - name: borough
        logicalType: string
        physicalType: VARCHAR
      - name: zone_name
        logicalType: string
        physicalType: VARCHAR
      - name: reporting_region
        logicalType: string
        physicalType: VARCHAR
      - name: trip_count
        logicalType: integer
        physicalType: BIGINT
        description: 'Billable trips: trips whose total amount is positive, in the reporting window (ADR 0003), read from agg_trip_zone_daily''s billable_trip_count.'
      - name: fare_revenue
        logicalType: number
        physicalType: DOUBLE
      - name: tip_revenue
        logicalType: number
        physicalType: DOUBLE
      - name: surcharge_revenue
        logicalType: number
        physicalType: DOUBLE
      - name: toll_revenue
        logicalType: number
        physicalType: DOUBLE
